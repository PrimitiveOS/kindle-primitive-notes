[workspace]
resolver = "2"
members = ["crates/notes-core", "crates/notes-render", "crates/notes-kindle", "crates/notes-desktop"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
notes-core = { path = "crates/notes-core" }
notes-render = { path = "crates/notes-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

[profile.release]
lto = true
codegen-units = 1
