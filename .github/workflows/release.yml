name: Release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    permissions:
      contents: write
    uses: DoanNguyenTrong/kindle-primitive-build/.github/workflows/package.yml@9533d481058f4d67b29568f40b30017ddcb32c8e
    with:
      id: primitive-notes
      dir: notes
      binary-crate: notes-kindle
      docs-licence-file: LICENSE-DOCS
      sibling-tools-ref: 529e2cb1a038d2af631426821c5ed4d42a68850d
      sibling-launcher-ref: 55d034c0101e51f84ca9050fe9cd0ee611699d68
