name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check out the native app kit
        uses: actions/checkout@v5
        with:
          repository: PrimitiveOS/kindle-primtitive-tools
          ref: 779145c93a65b2fb8c104485af6489a8ef565de6
          path: .tools-source
          persist-credentials: false
      - name: Make the app kit available as a sibling folder
        run: ln -sT "$GITHUB_WORKSPACE/.tools-source" "$GITHUB_WORKSPACE/../doannt-kindle-tools"
      - name: Check out the launcher's fonts
        uses: actions/checkout@v5
        with:
          repository: PrimitiveOS/kindle-primitive-launcher
          ref: 55d034c0101e51f84ca9050fe9cd0ee611699d68
          path: .launcher-source
          persist-credentials: false
      - name: Make the launcher available as a sibling folder
        run: ln -sT "$GITHUB_WORKSPACE/.launcher-source" "$GITHUB_WORKSPACE/../doannt-kindle-launcher"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --workspace --locked
